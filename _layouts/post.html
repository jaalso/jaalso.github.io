---
layout: default
---
<article>
  <div class="article-head">
    <div class="date">{{ page.date | date: "%Y-%m-%d" }}{% if page.category %} · {{ page.category }}{% endif %}</div>
    <h1>{{ page.title }}</h1>
    {% if page.tags.size > 0 %}
    <div class="tags">
      {% for tag in page.tags %}<a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>{% endfor %}
    </div>
    {% endif %}
  </div>
  <div class="content">
    {{ content }}
  </div>
</article>
